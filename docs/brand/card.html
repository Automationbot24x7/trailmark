<!doctype html>
<html><head><meta charset="utf-8">
<!-- Title cards over the paper-cut illustration (trail-art.png).
     Usage: card.html?img=trail-art.png&w=1200&h=800&mode=thumb|banner|og -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; background: #1b1916; }
  #c { position: relative; overflow: hidden; }
  #art { position: absolute; }
  .label { position: absolute; background: #f7f1e6; box-shadow: 0 10px 28px rgba(20, 14, 8, .38); border-left: 8px solid #c7341f; }
  .brand { display: flex; align-items: center; gap: 12px; font: 800 26px 'Inter Tight', sans-serif; color: #141414; letter-spacing: -.02em; }
  .brand svg { width: 46px; height: 30px; }
  h1 { margin: 14px 0 0; font: 800 64px/1.02 'Inter Tight', sans-serif; letter-spacing: -.035em; color: #141414; }
  p { margin: 14px 0 0; font: 600 22px/1.38 'Inter Tight', sans-serif; color: #3b3a37; }
  .tag { margin-top: 12px; font: 600 14px 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #75716a; }
</style></head>
<body>
<div id="c">
  <img id="art" alt="">
  <div class="label" id="label">
    <div class="brand"><svg viewBox="0 0 40 24"><path d="M3 19 L13 7 L23 13" stroke="#141414" stroke-width="2.4" fill="none"/><path d="M23 13 L35 4" stroke="#c7341f" stroke-width="2.4" stroke-dasharray="3.2 2.6" fill="none"/><circle cx="3" cy="19" r="2.9" fill="#141414"/><circle cx="13" cy="7" r="2.9" fill="#141414"/><circle cx="23" cy="13" r="2.9" fill="#141414"/><circle cx="35" cy="4" r="2.9" fill="#f7f1e6" stroke="#c7341f" stroke-width="1.6"/></svg>Trailmark</div>
    <h1 id="h">Why doesn’t this invoice reconcile?</h1>
    <p id="p"></p>
    <div class="tag" id="t"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1200, H = +q.get('h') || 800, mode = q.get('mode') || 'thumb';
  const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
  const art = document.getElementById('art'); art.src = q.get('img');
  const set = (id, css) => Object.assign(document.getElementById(id).style, css);
  // the illustration is 3:2 with a thin paper frame; scale past the frame, then pick the vertical window
  const place = (scale, yShift) => {
    const aw = W * scale, ah = aw * 2 / 3;
    Object.assign(art.style, { width: aw + 'px', height: ah + 'px', left: (W - aw) / 2 + 'px', top: ((H - ah) / 2 + yShift) + 'px' });
  };
  const hide = (id) => { document.getElementById(id).style.display = 'none'; };
  if (mode === 'thumb') {
    place(1.07, 0);
    set('label', { left: '44px', top: '40px', padding: '26px 34px 30px 30px', width: '560px' });
    set('h', { fontSize: '62px' }); hide('p'); hide('t');
  } else if (mode === 'banner') {
    place(1.07, 40);
    set('label', { left: '64px', top: '56px', padding: '30px 40px 34px 34px', width: '700px' });
    set('h', { fontSize: '72px' });
    document.getElementById('p').textContent = 'Accounts payable as a Relate graph. Six checks walk every invoice from purchase order to bank line and our GSTR-2B, and land on the link that broke.';
    hide('t');
  } else {
    place(1.07, 40);
    set('label', { left: '40px', top: '36px', padding: '22px 30px 24px 26px', width: '500px' });
    set('h', { fontSize: '52px' }); hide('p');
    document.getElementById('t').textContent = 'Relate graph · runs in your browser';
  }
</script>
</body></html>
